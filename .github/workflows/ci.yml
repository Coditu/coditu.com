name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The way back in when a pull request stops producing runs (a conflicting
  # branch has no merge ref, so nothing is scheduled), and a way to re-run the
  # suite without inventing a commit.
  workflow_dispatch:

permissions:
  contents: read

# This repository is PUBLIC, so every job runs on a GitHub-hosted runner. A fork
# PR's workflow is the fork author's code: do not register a self-hosted runner
# here.

jobs:
  check:
    name: blocking release checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: ./scripts/verify-tokens.sh
      - run: npx playwright install --with-deps chromium webkit
      - run: SKIP_BUILD=1 ./scripts/with-prod-server.sh node scripts/check-budgets.mjs
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: e2e-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # A missing secret is "not configured", not "broken": the deploy is skipped
  # with a summary that says so, instead of failing every push to `main`.
  preflight:
    name: is the production deploy configured
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    outputs:
      configured: ${{ steps.probe.outputs.configured }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
    steps:
      - id: probe
        name: Report which deploy values are present, by name only
        run: |
          set -uo pipefail
          missing=""
          for required in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN PRODUCTION_BASE_URL; do
            if [ -n "${!required:-}" ]; then
              printf '  present  %s\n' "$required"
            else
              printf '  MISSING  %s\n' "$required"
              missing="$missing $required"
            fi
          done
          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "the production deploy is configured" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=Production deploy is not configured::missing:$missing"
          {
            echo "### Production deploy: NOT CONFIGURED"
            echo
            echo "This commit was **not deployed**. The deploy job was skipped, not failed."
            echo "These values are not set:"
            echo
            for required in $missing; do echo "- \`$required\`"; done
            echo
            echo "Until they are set, production stays on whatever commit it is already serving."
          } >> "$GITHUB_STEP_SUMMARY"

  # Production deploys from here on green, not from a push: `vercel.json`
  # disables Git deployments for `main`. Stage, smoke, promote, and roll back if
  # the public smoke fails — see `scripts/deploy-production.sh`.
  deploy:
    name: production deploy after blocking checks
    needs: [check, preflight]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stamp the commit this release claims to be
        run: |
          npm install --global vercel@59.9.1
          node scripts/write-build-health.mjs
      - name: Stage, smoke and promote the checked commit
        id: production_deploy
        run: ./scripts/deploy-production.sh
      - name: Record the promoted deployment
        run: |
          printf 'Production deployment: %s\n' "${{ steps.production_deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

  # Report-only: Lantern is a simulation and its scores move on an identical
  # build, so a red here is something to read, not something that blocks.
  lighthouse:
    name: lighthouse (report-only)
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lighthouse
